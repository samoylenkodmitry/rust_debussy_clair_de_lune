name: Self-hosted runner check
on:
  workflow_dispatch:

jobs:
  mac-check:
    name: macOS self-hosted smoke check
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          echo "host: $(hostname)"
          uname -a
          sw_vers
          echo "PATH=$PATH"
          which cargo rustc xcodebuild
          rustc --version
          cargo --version
          xcodebuild -version | head -1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release
